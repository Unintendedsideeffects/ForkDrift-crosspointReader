[project]
name = "crosspoint-reader"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Unintendedsideeffects", email = "malcolmcosenza@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "clang-format>=21.1.8",
    "platformio>=6.1.19",
    "pytest>=8.3.2",
    "vulture>=2.14",
    "fonttools>=4.62.1",
    "freetype-py>=2.5.1",
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
    "cairosvg>=2.9.0",
    "matplotlib>=3.10.9",
    "pyserial>=3.5",
    "colorama>=0.4.6",
    "intelhex>=2.3.0",
]

[tool.ruff]
exclude = [
    ".venv",
    ".venv.stale-20260325",
    "docs/configurator/node_modules",
]

[tool.vulture]
exclude = [
    ".venv/",
    ".venv.stale-20260325/",
    "docs/configurator/node_modules/",
]
ignore_names = [
    "SCREEN_WIDTH",
    "SCREEN_HEIGHT",
    "chapter_title",
    "draw_text_wrapped",
    "dtr",
    "do_DELETE",
    "do_GET",
    "do_POST",
    "do_PUT",
    "log_message",
    "parse_workflow_cmd_enables",
    "parse_workflow_inputs",
    "rts",
]
