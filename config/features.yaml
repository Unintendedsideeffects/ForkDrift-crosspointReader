profiles:
  lean:
    description: Core reader only (~1.7MB, maximum flash headroom)
    features: {}

  standard:
    description: Balanced defaults (~5.0MB, recommended)
    features:
      bookerly_fonts: true
      notosans_fonts: true
      image_sleep: true
      epub_support: true
      book_images: true
      hyphenation: true
      xtc_support: true
      lyra_theme: true
      flow_theme: false
      ota_updates: true
      background_server: true
