name: CI (build)

on:
  push:
    branches: [fork-drift, "release/**"]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.diff.outputs.firmware }}
      simulator: ${{ steps.diff.outputs.simulator }}
      delivery: ${{ steps.diff.outputs.delivery }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with: { python-version: '3.11' }
      - id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            python scripts/ci/classify_changes.py --force-all --github-output "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE"...HEAD | python scripts/ci/classify_changes.py --github-output "$GITHUB_OUTPUT"

  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run clang-format
        run: |
          uv run ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  feature-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Validate feature key synchronization
        run: uv run python scripts/check_feature_key_sync.py

      - name: Validate generated platformio-custom.ini is up to date
        run: |
          uv run python scripts/generate_build_config.py --profile standard
          git diff --exit-code -- platformio-custom.ini

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run full test suite
        run: uv run pytest -q

  contract-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Validate published HTTP contract
        run: python3 scripts/validate_contract_server.py

  cleanup-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-platformio-

      - name: Run cleanup checks
        run: |
          uv run vulture scripts
          bash scripts/check_feature_boundaries.sh
          uv run pio check -e default --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  hardware-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.14'

      - name: Check hardware coding patterns
        run: python3 scripts/check_hardware_patterns.py

  simulator-smoke-test:
    needs: changes
    if: needs.changes.outputs.simulator == 'true'
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ~/.ccache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-platformio-

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('platformio.ini') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('platformio.ini') }}-
            ccache-${{ runner.os }}-${{ github.job }}-

      - name: Cache PlatformIO libdeps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .pio/libdeps
          key: libdeps-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: libdeps-${{ runner.os }}-

      - name: Run simulator smoke test (basic)
        env:
          FORKDRIFT_SIMULATOR_SMOKE_FRAMES: /tmp/frames
        run: |
          mkdir -p /tmp/frames
          python3 scripts/run_simulator_smoke_test.py --page-turns 3 --timeout 300

      - name: Run simulator smoke test (with book)
        env:
          FORKDRIFT_SIMULATOR_SMOKE_FRAMES: /tmp/frames
        run: |
          mkdir -p /tmp/simfs/books
          cp test/epubs/test_supsub.epub /tmp/simfs/books/
          python3 scripts/run_simulator_smoke_test.py --page-turns 3 --fs-root /tmp/simfs --book /books/test_supsub.epub --no-build --timeout 300

      - name: Run simulator recovery smoke test
        run: python3 scripts/run_simulator_smoke_test.py --recovery --no-build --timeout 120

      - name: Run simulator SD-failure smoke test
        run: python3 scripts/run_simulator_smoke_test.py --sd-fail --no-build --timeout 120

      - name: Upload frame dumps on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulator-smoke-frames
          path: /tmp/frames
          retention-days: 7
          if-no-files-found: ignore

  clang-tidy:
    # Non-blocking: intentionally NOT in test-status.needs during rollout.
    # Produces warnings visible in the Actions tab without failing PRs.
    needs: changes
    if: needs.changes.outputs.simulator == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate compile_commands.json
        run: uv run pio run -t compiledb

      - name: Patch compile_commands.json for clang
        # Strip GCC-only flags that abort clang's parser. Without this the
        # compile DB is unusable and every check (including misc-no-recursion)
        # silently produces no findings.
        run: |
          sed -i \
            -e 's/-fno-tree-switch-conversion//g' \
            -e 's/-fstrict-volatile-bitfields//g' \
            -e 's/-mlongcalls//g' \
            -e 's/-free//g' \
            -e 's/-fno-shrink-wrap//g' \
            compile_commands.json

      - name: Run clang-tidy on src/
        run: |
          set -euo pipefail
          # Locate riscv32-esp toolchain libstdc++ headers (clang doesn't find
          # them on its own; without these <algorithm>, <vector>, etc. fail to
          # parse and call-graph checks produce false negatives).
          TC_CXX=$(find ~/.platformio/packages/toolchain-riscv32-esp/riscv32-esp-elf/include/c++ \
            -maxdepth 1 -mindepth 1 -type d | head -1)
          if [ -z "$TC_CXX" ]; then
            echo "::error::riscv32-esp toolchain headers not found"
            exit 1
          fi
          EXTRA=(--extra-arg=-isystem "--extra-arg=$TC_CXX"
                 --extra-arg=-isystem "--extra-arg=$TC_CXX/riscv32-esp-elf")
          # Find all first-party source files (exclude lib/ third-party code)
          find src \( -name '*.cpp' -o -name '*.h' \) | sort | while read -r f; do
            echo "::group::$f"
            clang-tidy -p . "${EXTRA[@]}" "$f" --quiet 2>&1 || true
            echo "::endgroup::"
          done

  build:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ~/.ccache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Check for reusable build artifact
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: firmware-default
        run: python3 scripts/ci/check_reusable_artifact.py

      - name: Download reused artifact
        if: steps.reuse.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_URL: ${{ steps.reuse.outputs.archive_url }}
          OUTPUT_DIR: .pio/build/default
        run: python3 scripts/ci/download_artifact.py

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        if: steps.reuse.outputs.found != 'true'
        with:
          python-version: '3.11'

      - name: Setup uv
        if: steps.reuse.outputs.found != 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: Install dependencies
        if: steps.reuse.outputs.found != 'true'
        run: uv sync --frozen

      - name: Cache ccache
        if: steps.reuse.outputs.found != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('platformio.ini') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('platformio.ini') }}-
            ccache-${{ runner.os }}-${{ github.job }}-

      - name: Cache PlatformIO libdeps
        if: steps.reuse.outputs.found != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .pio/libdeps
          key: libdeps-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: libdeps-${{ runner.os }}-

      - name: Build CrossPoint
        if: steps.reuse.outputs.found != 'true'
        run: |
          set -euo pipefail
          uv run pio run | tee pio.log

      - name: Enforce flash headroom
        if: steps.reuse.outputs.found != 'true'
        run: |
          uv run python scripts/check_flash_headroom.py \
            --log pio.log \
            --firmware .pio/build/default/firmware.bin \
            --min-headroom-kb 64

      - name: Extract firmware stats
        if: steps.reuse.outputs.found != 'true'
        run: |
          set -euo pipefail
          ram_line="$(grep -E "RAM:\\s" -m1 pio.log || true)"
          flash_line="$(grep -E "Flash:\\s" -m1 pio.log || true)"
          echo "ram_line=${ram_line}" >> "$GITHUB_OUTPUT"
          echo "flash_line=${flash_line}" >> "$GITHUB_OUTPUT"
          if [ -z "$ram_line" ]; then echo "::warning::RAM usage not found in build log — PlatformIO output format may have changed"; fi
          if [ -z "$flash_line" ]; then echo "::warning::Flash usage not found in build log — PlatformIO output format may have changed"; fi
          {
            echo "## Firmware build stats"
            if [ -n "$ram_line" ]; then echo "- ${ram_line}"; else echo "- RAM: not found"; fi
            if [ -n "$flash_line" ]; then echo "- ${flash_line}"; else echo "- Flash: not found"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report reused build
        if: steps.reuse.outputs.found == 'true'
        run: |
          {
            echo "## Firmware build stats — reused"
            echo ""
            echo "Reused artifact from run [#${{ steps.reuse.outputs.source_run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ steps.reuse.outputs.source_run_id }})."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        if: steps.reuse.outputs.found != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-default
          path: .pio/build/default/firmware-*.bin
          retention-days: 7
          if-no-files-found: error

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - changes
      - build
      - clang-format
      - feature-sync
      - host-tests
      - contract-server
      - hardware-patterns
      - cleanup-checks
      - simulator-smoke-test
      - workflow-lint
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/*.yml

  delivery:
    needs: [changes, test-status]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/fork-drift'
      && needs.changes.outputs.delivery == 'true'
    uses: ./.github/workflows/build.yml
    with:
      publish_latest: true
    permissions:
      contents: write
      actions: read
