name: Compile Release
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "latest"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache PlatformIO packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-platformio-

      - name: Build CrossPoint
        run: uv run pio run -e gh_release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CrossPoint-${{ github.ref_name }}
          retention-days: 30
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware-*.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
