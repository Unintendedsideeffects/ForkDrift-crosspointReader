name: Nightly Release

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: scripts/ci
      - name: Verify CI success
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/ci/verify_ci_success.py

  nightly:
    runs-on: ubuntu-latest
    needs: verify-ci
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7.6.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache PlatformIO
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-platformio-

      - name: Set build date
        run: |
          DATE=$(date -u +%Y%m%d)
          BASE=$(grep -E '^version\s*=' platformio.ini | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          echo "BUILD_DATE=${DATE}" >> $GITHUB_ENV
          echo "CHANNEL_VERSION=${BASE}-nightly+${DATE}" >> $GITHUB_ENV

      - name: Build firmware (nightly)
        run: |
          set -o pipefail
          uv run pio run -e gh_nightly | tee pio.log

      - name: Enforce flash headroom
        run: |
          uv run python scripts/check_flash_headroom.py \
            --log pio.log \
            --firmware .pio/build/gh_nightly/firmware.bin \
            --min-headroom-kb 64

      - name: Remove existing nightly assets (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_ids="$(gh api repos/${{ github.repository }}/releases/tags/nightly --jq '.assets[] | select((.name | test("^firmware-[0-9]{8}-[0-9a-fA-F]{7,40}\\.bin$")) or .name=="partitions.bin" or .name=="bootloader.bin") | .id' 2>/dev/null || true)"
          if [ -z "$asset_ids" ]; then
            echo "No existing nightly assets to remove."
            exit 0
          fi
          for asset_id in $asset_ids; do
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${asset_id}" || true
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: nightly
          name: ${{ env.CHANNEL_VERSION }}
          generate_release_notes: false
          draft: false
          prerelease: true
          files: |
            .pio/build/gh_nightly/firmware-*.bin
            .pio/build/gh_nightly/partitions.bin
            .pio/build/gh_nightly/bootloader.bin

      - name: Measure feature sizes (quick)
        run: uv run python scripts/measure_feature_sizes.py --quick

      - name: Apply measured sizes
        run: uv run python scripts/apply_feature_sizes.py

      - name: Upload feature size updates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-feature-size-updates
          path: |
            scripts/generate_build_config.py
            docs/configurator/index.html
          retention-days: 7
