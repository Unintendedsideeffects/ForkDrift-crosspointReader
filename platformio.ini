[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs =
  platformio-custom.ini
  platformio.local.ini

[crosspoint]
version = 1.4.1

[base]
platform = espressif32 @ 6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
platform_packages = tool-cppcheck@1.21100.230717
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_unflags =
  -fexceptions
  -std=gnu++11

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -Iinclude
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -Wno-bidi-chars
  -DLUA_32BITS
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  ; NimBLE two-host fix (2026-06-23): arduino-esp32 3.x's prebuilt libbt.a is
  ; built with CONFIG_BT_NIMBLE_ENABLED=y, so it carries a *complete* IDF NimBLE
  ; host + NPL on top of the controller. h2zero/NimBLE-Arduino @2.3.6 bundles its
  ; own host too; both link and their NPL static state splits at runtime ->
  ; npl_freertos_mutex_pend null-mutex panic at BLE start. On the C3 the
  ; controller talks to the host only over VHCI, so scripts/strip_nimble_host_
  ; from_libbt.py deletes the duplicate IDF host objects from libbt.a (keeping
  ; the controller bridge) and lets NimBLE-Arduino's bundled host be the sole
  ; host. See plans/019-finish-nimble-ble-migration.md for the full investigation.
  -fno-exceptions
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections


; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_lock.py
  pre:scripts/use_ccache.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/gen_version.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/strip_nimble_host_from_libbt.py
  post:scripts/name_firmware_artifact.py
  post:scripts/register_unit_tests_target.py

; Private libraries under lib/third_party are required by the firmware build,
; including uzlib for font/image decompression.
lib_extra_dirs =
  lib/third_party

; Libraries
lib_deps =
  BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://open-x4-sdk/libs/display/EInkDisplay
  SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  h2zero/NimBLE-Arduino @ 2.3.6
lib_ignore = BLE

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/gen_version.py (<version>-dev+<branch>.<short_sha>)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=0
  -DENABLE_BOOKERLY_FONTS=0
  -DENABLE_NOTOSANS_FONTS=0
  -DENABLE_OPENDYSLEXIC_FONTS=0
  -DENABLE_IMAGE_SLEEP=1
  -DENABLE_BOOK_IMAGES=1
  -DENABLE_MARKDOWN=1
  -DENABLE_INTEGRATIONS=1
  -DENABLE_KOREADER_SYNC=1
  -DENABLE_CALIBRE_SYNC=1
  -DENABLE_OPDS=1
  -DENABLE_BACKGROUND_SERVER=1
  -DENABLE_BACKGROUND_SERVER_ON_CHARGE=1
  -DENABLE_BACKGROUND_SERVER_ALWAYS=1
  -DENABLE_HOME_MEDIA_PICKER=1
  -DENABLE_WEB_WALLPAPER_PLUGIN=1
  -DENABLE_POKEMON_WALLPAPER_PLUGIN=1
  -DENABLE_POKEMON_PARTY=1
  -DENABLE_EPUB_SUPPORT=1
  -DENABLE_HYPHENATION=1
  -DENABLE_XTC_SUPPORT=1
  -DENABLE_LYRA_THEME=1
  -DENABLE_OTA_UPDATES=1
  -DENABLE_TODO_PLANNER=1
  -DENABLE_NOTES=1
  -DENABLE_ANKI_SUPPORT=1
  -DENABLE_DARK_MODE=1
  -DENABLE_VISUAL_COVER_PICKER=1
  -DENABLE_BLE_WIFI_PROVISIONING=1
  -DENABLE_BLE_PAGE_TURNER=1
  -DENABLE_USER_FONTS=1
  -DENABLE_WEB_WIFI_SETUP=1
  -DENABLE_REMOTE_CONTROL=1
  -DENABLE_REMOTE_KEYBOARD_INPUT=1
  -DENABLE_WIFI_CLOCK=1
  -DENABLE_ROMAN_CLOCK_SLEEP=1
  -DENABLE_HAIKU_CLOCK=1
  -DENABLE_LEXENDDECA_FONTS=1
  -DENABLE_BITTER_FONTS=0
  -DENABLE_CHAREINK_FONTS=1
  -DENABLE_READING_STATS=1
  -DENABLE_MINIMAL_THEME=1
  -DENABLE_FOCUS_READING=1
  -DENABLE_GUIDE_DOTS=1

; Rolling dev channel – every merged commit updates this release tag on GitHub.
; Release name must be set to the version string (e.g. "12345-dev") by CI.
[env:gh_latest]
extends = base
build_flags =
  ${base.build_flags}
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=0 ; Set log level to error for latest builds

; Nightly channel – built once per day from HEAD.
; Release name must be set to the build date (e.g. "20240218") by CI.
[env:gh_nightly]
extends = base
build_flags =
  ${base.build_flags}
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=0 ; Set log level to error for nightly builds

[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

; Desktop simulator — runs the real firmware loop in an SDL2 window.
; Arch Linux: sudo pacman -S sdl2 openssl
; Debian/Ubuntu/WSL: sudo apt install libsdl2-dev libssl-dev
; Build: uv run pio run -e simulator
; Run:   ~/.cache/crosspoint-pio-build/simulator/program  (platformio.local.ini build_dir)
[env:simulator]
platform = native
build_src_filter =
  +<*>
  -<network/server/>
  +<network/server/FileListApi.cpp>
  +<network/server/DirScan.cpp>
  +<network/server/RemoteKeyboardSession.cpp>
  +<network/server/SettingsApi.cpp>
  +<network/server/SettingsApply.cpp>
  -<network/ota/FirmwareFlasher.cpp>
  -<network/ota/OtaBootSwitch.cpp>
  -<network/ota/OtaUpdater.cpp>
  -<platform/skip_efuse_blk_check.c>
  -<features/web_wifi_setup/Registration.cpp>
  -<network/background/BackgroundWifiService.cpp>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  -lssl
  -lcrypto
  -Wno-deprecated-declarations
  -Wno-narrowing
  -DSIMULATOR
  -DCROSSPOINT_VERSION=\"dev-simulator\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -DENABLE_BLE_WIFI_PROVISIONING=0
  -DENABLE_BLE_PAGE_TURNER=1
  -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
  -DENABLE_POKEMON_PARTY=1
  -DENABLE_HOME_MEDIA_PICKER=1
  -DENABLE_POKEMON_WALLPAPER_PLUGIN=1
  -DENABLE_BOOKERLY_FONTS=0
  -DENABLE_NOTOSANS_FONTS=0
  -DENABLE_OPENDYSLEXIC_FONTS=0
  -DENABLE_LEXENDDECA_FONTS=1
  -DENABLE_BITTER_FONTS=0
  -DENABLE_CHAREINK_FONTS=1
  -DENABLE_USER_FONTS=1
  -Isrc
  -Iinclude
  -I.pio/libdeps/simulator/simulator/src
  -Isrc/simulator/shims
  -include src/simulator/freertos_compat.h
lib_extra_dirs = lib/third_party
lib_ignore = hal, PNGdec, JPEGDEC
extra_scripts =
  pre:scripts/build_lock.py
  pre:scripts/gen_i18n.py
  pre:scripts/gen_version.py
  pre:scripts/build_html.py
  pre:scripts/patch_simulator_hal.py
lib_deps =
  # pinned — bump deliberately and re-run the anchor check in scripts/patch_simulator_hal.py
  simulator=https://github.com/uxjulia/crosspoint-simulator#efe37c6779e1f977cb361240f56ba4028d1c13f6
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  links2004/WebSockets @ 2.7.3
